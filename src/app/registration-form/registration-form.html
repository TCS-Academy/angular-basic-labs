<div style="border: 2px solid purple; padding: 20px;">
    <h3>Template-Driven Registration Form</h3>

     <form #regForm="ngForm"> 
        <div class="form-group">
            <label for="username">ชื่อผู้ใช้:</label>
            <input 
                type="text" 
                id="username" 
                name="username" 
                [(ngModel)]="username" 
                required> 
            <p 
                *ngIf="regForm.controls['username']?.invalid && regForm.controls['username']?.touched" 
                style="color: red; font-size: 0.9em;">
                ชื่อผู้ใช้ห้ามว่าง
            </p>
        </div>
        
        <button type="submit" [disabled]="regForm.invalid">Submit Registration</button>
        
        <hr>
        <p>ฟอร์มถูกต้องหรือไม่: <strong>{{ regForm.valid }}</strong></p>
    </form>
</div>
